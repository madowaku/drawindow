name: DRAWINDOW offline local lab
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/offline-local-lab.yml'
      - 'public/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      # The credential/PowerShell suite runs separately on Windows in DRAWINDOW quality.
      - name: Package fully local research build
        run: npm run package:offline
      - name: Install Chromium for real offline relaunch test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Test service worker cold relaunch with network disabled
        run: node scripts/qa-offline-cold-start.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: DRAWINDOW-local-lab
          path: |
            artifacts/release/*offline*
            artifacts/release/package-receipt.json
          retention-days: 7
