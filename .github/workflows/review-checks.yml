name: Review checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'public/art/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/review-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out review revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run regression suite
        run: npm test
      - name: Type-check and build
        run: npm run build
