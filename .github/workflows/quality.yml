name: DRAWINDOW quality

on:
  pull_request:
    branches:
      - main
      - feat/japanese-shiritori-v05
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Game, build and release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run package:itch

  credential-harness:
    name: Credential safety (Windows PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:auth
