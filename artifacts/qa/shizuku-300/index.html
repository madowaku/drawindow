function render(){const rows=single?[groups[group].doodles[item]]:groups[group].doodles;document.querySelector('.grid').classList.toggle('single',single);document.querySelector('.pager').hidden=!single;document.querySelector('.pager').style.display=single?'flex':'none';document.querySelector('#position').textContent=(item+1)+' / '+groups[group].doodles.length;document.querySelector('.grid').innerHTML=rows.map(d=>'<article><svg viewBox="0 0 120 120" role="img" aria-label="'+(names?d.labelJa:'しずくの絵')+'">'+d.strokes.map(s=>'<path d="'+s.path+'"/>').join('')+'</svg><p class="answer">'+d.labelJa+'<small>'+d.labelEn+'</small></p></article>').join('');}
